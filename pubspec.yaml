name: calendar_appointment_app
description: An offline-first digital calendar application.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  table_calendar: ^3.1.1
  url_launcher: ^6.3.0
  uuid: ^4.4.0
  flutter_native_contact_picker: ^0.0.12
  share_plus: ^9.0.0
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  flutter_timezone: ^4.1.1
  provider: ^6.1.2
  path_provider: ^2.1.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_ce_generator: ^1.11.2
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 23

flutter_native_splash:
  color: "#6750A4"
  image: assets/icon/app_icon.png
  android_12:
    image: assets/icon/app_icon.png
    color: "#6750A4"
    icon_background_color: "#6750A4"

flutter:
  uses-material-design: true
